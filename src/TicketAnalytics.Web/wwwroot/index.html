<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>TicketAnalytics · Banco Santa Cruz</title>
    <base href="/" />
    <link rel="stylesheet" href="_content/MudBlazor/MudBlazor.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="css/app-v2.css" />
    <script>
        // Modo noche: se aplica antes de pintar para evitar el destello claro.
        // Preferencia guardada (ta-tema = oscuro | claro); si no hay, la del sistema operativo.
        (function () {
            try {
                var t = localStorage.getItem('ta-tema');
                if (t === 'oscuro' || (t === null && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches))
                    document.documentElement.classList.add('ta-oscuro');
            } catch (e) { /* sin almacenamiento: tema claro */ }
        })();
    </script>
</head>
<body>
    <div id="app">
        <div class="loading-host">
            <div class="loading-mark">TA</div>
            <div class="loading-text">Cargando TicketAnalytics…</div>
        </div>
    </div>
    <div id="blazor-error-ui">
        Ocurrió un error no controlado.
        <a href="" class="reload">Recargar</a>
        <a class="dismiss">🗙</a>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
</body>
</html>
